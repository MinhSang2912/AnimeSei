version: '3.8'

services:
  animesei-api:
    build:
      context: .
      dockerfile: src/AnimeSei.API/Dockerfile
    container_name: animesei-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${SUPABASE_CONNECTION_STRING}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
    restart: always

  animesei-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: animesei-client
    ports:
      - "5173:80"
    depends_on:
      - animesei-api
    restart: always
